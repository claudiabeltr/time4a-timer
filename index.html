<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>time4a-timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="sprite" class="idle"></div>
        <div id="timer-row">
            <button id="minus">-</button>
            <input class="display" id="display">00:00:00</input>
            <button id="plus">+</button>
        </div>

        <div id="main-controls">
            <button id="help" title="Need help?">?</button>
            <button id="play-pause">▶</button>
            <button id="stop">■</button>
        </div>
    </div>
    
    <script src="renderer.js"></script>
</body>
</html>
