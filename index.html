<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>time4a-timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="exit">✕</button>
    <div id="app">
        <div id="sprite-row">
            <button id="prev-skin">◀</button>
            <div id="sprite" class="idle"></div>
            <button id="next-skin">▶</button>
        </div>
        <div id="timer-row">
            <button id="minus">-</button>
            <input type="text" class="display" id="display" value="00:00:00" maxlength="8"/>
            <button id="plus">+</button>
        </div>

        <div id="main-controls">
            <button id="help" title="Need help?">?</button>
            <button id="play-pause">▶</button>
            <button id="stop">■</button>
        </div>
    </div>
    
    <script src="renderer.js"></script>
</body>
</html>
