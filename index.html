<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>time4a-timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="new-timer" title="New timer">+</button>
    <button id="exit">✕</button>
    <div id="app">
        <div id="sprite-row">
            <button id="prev-skin" title="Previous skin">◀</button>
            <div id="sprite" class="idle"></div>
            <button id="next-skin" title="Next skin">▶</button>
        </div>
        <div id="timer-row">
            <button id="minus" title="-10 seconds">-</button>
            <input type="text" class="display" id="display" value="00:00:00" maxlength="8"/>
            <button id="plus" title="+10 seconds">+</button>
        </div>

        <div id="main-controls">
            <button id="help" title="Need help?">?</button>
            <button id="play-pause">▶</button>
            <button id="stop" title="Stop">■</button>
        </div>
    </div>
    
    <script src="renderer.js"></script>
</body>
</html>
